<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>CONTINIUM · Stage OS · arg/xarg/arg3te Viewer</title>

<style>
body { margin:0; background:#000; color:#0f0; font-family:Consolas; }
#out {
    position:absolute; top:20px; left:20px;
    width:520px; height:600px;
    background:#111; border-left:3px solid #6cf;
    padding:15px; overflow:auto;
}
canvas { display:block; }
</style>
</head>

<body>
<pre id="out"></pre>
<canvas id="cv"></canvas>

<script type="module">

import { QUANT } from "./JS/CONST_QUANT.js";
import { CONTINIUM_KEY } from "./JS/CONTINIUM_KEY.js";
import { MIND_QUANT } from "./JS/MIND_QUANT.js";
import { NC_PIPELINE } from "./JS/NC_PIPELINE.js";
import { WHIRL, PIPELINE_3_6, CONTINIUM_TRUTH } from "./JS/UM.js";
import { LAUF } from "./JS/lauf.js";
import { RUN8 } from "./JS/real.reaspo.scan.js";
import { SLIDE } from "./JS/slide.js";
import { TMP_MATRIX } from "./tmp/360.js";

RUN8();
QUANT.start();

const cv = document.getElementById("cv");
cv.width = window.innerWidth;
cv.height = window.innerHeight;
const ctx = cv.getContext("2d");

function arg(t){ return CONTINIUM_KEY.pos(t); }
function xarg(a){ return SLIDE(a).vec; }
function arg3te(t){
    let e = 0;
    for(const k in TMP_MATRIX) e += Math.abs(TMP_MATRIX[k].calc(t));
    return e / 1200;
}

function LOOP(){
    const t = performance.now() * 0.0004;

    const A = arg(t);
    const X = xarg(A);
    const E = arg3te(t);

    const scene = {
        arg: A,
        xarg: X,
        arg3te: E,
        atom: QUANT.atom.seq[Math.floor((t*10)%QUANT.atom.seq.length)],
        qsxi: QUANT.qsxi(),
        singular: QUANT.singular(A),
        tmp: Object.fromEntries(Object.entries(TMP_MATRIX).map(([k,v])=>[k,v.calc(t)])),
        mind: MIND_QUANT(),
        nc: NC_PIPELINE(),
        truth: CONTINIUM_TRUTH(),
        whirl: WHIRL({x:9,y:6,z:3}),
        lauf: LAUF.komplett(),
        skills: CONTINIUM_KEY.skills
    };

    ctx.clearRect(0,0,cv.width,cv.height);

    ctx.fillStyle="#0f0";
    ctx.font="22px Consolas";
    ctx.fillText("arg/xarg/arg3te Viewer", 40, 60);

    document.getElementById("out").textContent = JSON.stringify(scene,null,2);

    orbitTick(0.016);
    requestAnimationFrame(LOOP);
}

PIPELINE_3_6();
LOOP();

</script>
</body>
</html>
