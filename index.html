<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CONTINIUM · 6x6 Kosmos · iki1uc</title>
<style>
  :root{--bg:#000;--fg:#0f0;--muted:#6f6;--accent:#6cf;--card:#111}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Consolas,monospace}
  .wrap{display:grid;grid-template-columns:360px 1fr;gap:12px;height:100vh;padding:12px;box-sizing:border-box}
  .card{background:var(--card);padding:12px;border-left:4px solid var(--accent);border-radius:6px;overflow:auto}
  header h1{margin:0 0 8px;color:var(--accent);font-size:18px}
  .layer{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(0,255,0,0.04)}
  #out{white-space:pre-wrap;font-family:monospace;font-size:12px;height:150px;overflow:auto;background:#0a0a0a;padding:8px;border-radius:4px}
  .controls{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
  button{background:var(--accent);border:none;padding:8px 10px;border-radius:6px;margin-right:6px;cursor:pointer}
  .small{padding:6px 8px;font-size:13px}
  .matrix{width:100%;overflow:auto;margin-top:10px;border:1px solid rgba(255,255,255,0.03);padding:6px;border-radius:6px}
  table.matrix-table{border-collapse:collapse;width:100%}
  table.matrix-table th, table.matrix-table td{border:1px solid rgba(255,255,255,0.03);padding:6px;text-align:center}
  input[type=range]{width:90px}
  canvas{width:100%;height:calc(100vh - 120px);display:block;background:transparent;border-radius:6px}
  .footer{font-size:12px;color:#8f8;margin-top:8px}
  .point{font-weight:700;color:#9f9}
</style>
</head>

        <div id="layersList" role="list"></div>
