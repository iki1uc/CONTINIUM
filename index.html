/* ======================================================
   START
====================================================== */
RUN8();
QUANT.start();

/* ======================================================
   CANVAS
====================================================== */
const cv = document.getElementById("cv");
cv.width = window.innerWidth;
cv.height = window.innerHeight;
const ctx = cv.getContext("2d");

/* ======================================================
   3 Geräte = PX / PC / GHOST
====================================================== */
const devices = [
    { name:"PX", color:"#0f0", score:0 },
    { name:"PC", color:"#6cf", score:0 },
    { name:"GHOST", color:"#f0f", score:0 }
];

/* ======================================================
   ARG / XARG / ARG3te
====================================================== */
function ARG(t,i){ return CONTINIUM_KEY.pos(t+i); }
function XARG(a){ return SLIDE(a).vec; }
function ARG3TE(t){
    let e = 0;
    for(const k in TMP_MATRIX) e += Math.abs(TMP_MATRIX[k].calc(t));
    return e / 1200;
}

/* ======================================================
   WETTE – Stabilitätsbewertung
====================================================== */
function WETTE(scene){
    return (
        Math.abs(scene.atom.length) +
        Math.abs(scene.qsxi.tokio.x % 7) +
        Math.abs(scene.singular.s.radius % 9)
    );
}

/* ======================================================
   UNIVERSAL DRAW
====================================================== */
function draw(scene){
    ctx.clearRect(0,0,cv.width,cv.height);

    const cx = cv.width/2;
    const cy = cv.height/2;

    // Orbit-Kreis
    ctx.strokeStyle = "#6cf";
    ctx.beginPath();
    ctx.arc(cx, cy, 180, 0, Math.PI*2);
    ctx.stroke();

    // 3 Geräte
    devices.forEach((d,i)=>{
        ctx.fillStyle = d.color;
        ctx.beginPath();
        ctx.arc(
            cx + Math.sin(scene.t + i)*140,
            cy + Math.cos(scene.t + i)*140,
            12, 0, Math.PI*2
        );
        ctx.fill();
    });

    // Atom
    ctx.fillStyle = "#0f0";
    ctx.font = "32px Consolas";
    ctx.fillText(scene.atom, cx - 16, cy - 16);
}
