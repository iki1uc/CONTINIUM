<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>CONTINIUM · OS · iki1uc</title>

<style>
body {
    background:#000;
    color:#0f0;
    font-family:Consolas, monospace;
    padding:25px;
}
h1 {
    color:#6cf;
    text-shadow:0 0 12px #6cf;
    margin-bottom:30px;
}
.block {
    background:#111;
    border:1px solid #333;
    padding:20px;
    margin-bottom:25px;
    border-radius:8px;
}
pre {
    background:#000;
    border-left:3px solid #6cf;
    padding:15px;
    white-space:pre-wrap;
}
</style>

<script type="module">
import { CONTINIUM_KEY } from "./CONTINIUM_KEY.js";
import { LAUF } from "./lauf.js";
import {
    GATE,
    WLOCH,
    WHIRL,
    PIPELINE_3_6,
    CONTINIUM_TRUTH
} from "./um.js";

// ==========================================
// ATOM‑Beweis Animation
// ==========================================
function ATOM_ANIM(t){
    const seq = CONTINIUM_KEY.sequence();
    return seq[Math.floor((t*10) % seq.length)];
}

// ==========================================
// QS‑XI‑XTender Integration
// ==========================================
function QSXI(t){
    return {
        tokio: CONTINIUM_KEY.pos(t),
        corlu: CONTINIUM_KEY.pos(t*1.33),
        hh:    CONTINIUM_KEY.pos(t*1.66)
    };
}

// ==========================================
// Singularitäts‑Orbit
// ==========================================
function SINGULAR_VIEW(t){
    const p = CONTINIUM_KEY.pos(t);
    const s = CONTINIUM_KEY.singularity(p);
    return { p, s };
}

// ==========================================
// CONTINIUM LOOP
// ==========================================
async function CONTINIUM_LOOP(){

    const t = performance.now() * 0.0004;

    // 3D Orbit
    const pos = CONTINIUM_KEY.pos(t);

    // Slide
    const slide = CONTINIUM_KEY.slideFrame(pos);

    // Score
    const score = CONTINIUM_KEY.stability(pos);

    // ATOM‑Beweis
    const atom = ATOM_ANIM(t);

    // QS‑XI‑XTender
    const qsxi = QSXI(t);

    // Singularität
    const singular = SINGULAR_VIEW(t);

    // UM
    const truth = CONTINIUM_TRUTH();
    const whirl = WHIRL({ x: 9, y: 6, z: 3 });

    // LAUF
    const lauf = LAUF.komplett();

    // Szene
    const scene = {
        orbit: pos,
        slide,
        score,
        atom,
        qsxi,
        singular,
        lauf,
        truth,
        whirl,
        skills: CONTINIUM_KEY.skills,
        frame: "CONTINIUM‑OS‑SZENE"
    };

    // Ausgabe (Browser‑Freeze‑Fix)
    requestAnimationFrame(() => {
        document.getElementById("out").textContent =
            JSON.stringify(scene, null, 2);
    });

    requestAnimationFrame(CONTINIUM_LOOP);
}

// ==========================================
// Start
// ==========================================
let pipe = null;

window.onload = () => {
    pipe = PIPELINE_3_6();   // nur EINMAL
    CONTINIUM_LOOP();        // danach frei
};
</script>

</head>

<body>

<h1>CONTINIUM · OS · iki1uc</h1>

<div class="block">
    <pre id="out">Starte CONTINIUM OS…</pre>
</div>

</body>
</html>
