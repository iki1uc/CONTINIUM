<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>CONTINIUM · Unified JS‑OS · iki1uc · UPGRADE</title>

<style>
body {
    margin:0;
    background:#000;
    color:#0f0;
    font-family:Consolas, monospace;
}
#out {
    position:absolute;
    top:20px;
    left:20px;
    width:460px;
    height:520px;
    overflow:auto;
    background:#111;
    border-left:3px solid #6cf;
    padding:15px;
}
canvas {
    display:block;
}
h2 { color:#6cf; }
</style>

<script type="module">

/* ======================================================
   IMPORTS — ALLE JS‑Module aus deinem neuen /JS/ Ordner
====================================================== */
import { QUANT } from "./JS/CONST_QUANT.js";
import { CONTINIUM_KEY } from "./JS/CONTINIUM_KEY.js";
import { MIND_QUANT } from "./JS/MIND_QUANT.js";
import { NC_PIPELINE } from "./JS/NC_PIPELINE.js";
import { WHIRL, PIPELINE_3_6, CONTINIUM_TRUTH } from "./JS/UM.js";
import { LAUF } from "./JS/lauf.js";
import { RUN8 } from "./JS/real.reaspo.scan.js";
import { SLIDE } from "./JS/slide.js";

/* ======================================================
   TMP‑Matrix (Orbit‑Physik)
====================================================== */
import { TMP_MATRIX } from "./tmp/360.js";

/* ======================================================
   DIGITAL COLD START
====================================================== */
RUN8();

/* ======================================================
   QUANT START
====================================================== */
QUANT.start();

/* ======================================================
   CANVAS
====================================================== */
const cv = document.createElement("canvas");
cv.width = window.innerWidth;
cv.height = window.innerHeight;
document.body.appendChild(cv);
const ctx = cv.getContext("2d");

/* ======================================================
   TEXT‑OUTPUT
====================================================== */
const out = document.createElement("pre");
out.id = "out";
out.textContent = "Starte CONTINIUM Unified JS‑OS UPGRADE…";
document.body.appendChild(out);

/* ======================================================
   TMP‑Matrix Physik
====================================================== */
function TMP_PHYSIK(t){
    const out = {};
    for(const key in TMP_MATRIX){
        out[key] = TMP_MATRIX[key].calc(t);
    }
    return out;
}

/* ======================================================
   ATOM‑Beweis
====================================================== */
function ATOM_ANIM(t){
    const seq = QUANT.atom.seq;
    return seq[Math.floor((t*10) % seq.length)];
}

/* ======================================================
   Singularität
====================================================== */
function SINGULAR_VIEW(t){
    const p = CONTINIUM_KEY.pos(t);
    const s = QUANT.singular(p);
    return { p, s };
}

/* ======================================================
   VISUAL DRAW
====================================================== */
function draw(scene){
    ctx.clearRect(0,0,cv.width,cv.height);

    const cx = cv.width/2;
    const cy = cv.height/2;

    /* ---------------------------------------------
       QS‑XI Dreieck
    --------------------------------------------- */
    ctx.strokeStyle = "#6cf";
    ctx.beginPath();
    ctx.moveTo(cx + scene.qsxi.tokio.x/30, cy + scene.qsxi.tokio.y/30);
    ctx.lineTo(cx + scene.qsxi.corlu.x/30, cy + scene.qsxi.corlu.y/30);
    ctx.lineTo(cx + scene.qsxi.hh.x/30,    cy + scene.qsxi.hh.y/30);
    ctx.closePath();
    ctx.stroke();

    /* ---------------------------------------------
       ATOM‑Beweis
    --------------------------------------------- */
    ctx.fillStyle = "#0f0";
    ctx.font = "32px Consolas";
    ctx.fillText(scene.atom, cx - 16, cy - 16);

    /* ---------------------------------------------
       Singularität
    --------------------------------------------- */
    ctx.strokeStyle = "#f00";
    ctx.beginPath();
    ctx.arc(cx, cy, scene.singular.s.radius/300, 0, Math.PI*2);
    ctx.stroke();

    /* ---------------------------------------------
       TMP‑Matrix Anzeige
    --------------------------------------------- */
    ctx.fillStyle = "#6cf";
    ctx.font = "18px Consolas";

    let y = cy + 140;
    for(const key in scene.tmp){
        ctx.fillText(`${key}: ${scene.tmp[key].toFixed(2)}`, cx - 200, y);
        y += 22;
    }

    /* ---------------------------------------------
       SLIDE‑Vektor
    --------------------------------------------- */
    ctx.fillStyle = "#0f0";
    ctx.fillText(
        `SLIDE → x:${scene.slide.vec.x.toFixed(2)} y:${scene.slide.vec.y.toFixed(2)} z:${scene.slide.vec.z.toFixed(2)}`,
        cx - 200, cy + 400
    );
}

/* ======================================================
   LOOP
====================================================== */
let pipe = null;

function CONTINIUM_LOOP(){

    const t = performance.now() * 0.0004;

    const pos = CONTINIUM_KEY.pos(t);
    const slide = SLIDE(pos);
    const score = CONTINIUM_KEY.stability(pos);

    const atom = ATOM_ANIM(t);
    const qsxi = QUANT.qsxi();
    const singular = SINGULAR_VIEW(t);

    const tmp = TMP_PHYSIK(t);
    const truth = CONTINIUM_TRUTH();
    const whirl = WHIRL({ x: 9, y: 6, z: 3 });
    const lauf = LAUF.komplett();
    const mind = MIND_QUANT();
    const nc = NC_PIPELINE();

    const scene = {
        orbit: pos,
        slide,
        score,
        atom,
        qsxi,
        singular,
        tmp,
        lauf,
        truth,
        whirl,
        mind,
        nc,
        quant: QUANT,
        skills: CONTINIUM_KEY.skills
    };

    draw(scene);

    out.textContent = JSON.stringify(scene, null, 2);

    orbitTick(0.016);

    requestAnimationFrame(CONTINIUM_LOOP);
}

/* ======================================================
   START
====================================================== */
window.onload = () => {
    pipe = PIPELINE_3_6();
    CONTINIUM_LOOP();
};
</script>

</head>
<body></body>
</html>
