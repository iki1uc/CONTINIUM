<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CONTINIUM · ALL‑X‑ALL Unified OS · iki1uc</title>
<style>
  :root{--bg:#000;--fg:#0f0;--muted:#6f6;--accent:#6cf;--card:#111}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Consolas,monospace}
  .wrap{display:grid;grid-template-columns:360px 1fr;gap:12px;height:100vh;padding:12px;box-sizing:border-box}
  .card{background:var(--card);padding:12px;border-left:4px solid var(--accent);border-radius:6px;overflow:auto}
  header h1{margin:0 0 8px;color:var(--accent);font-size:18px}
  #out{white-space:pre-wrap;font-family:monospace;font-size:12px;height:160px;overflow:auto;background:#0a0a0a;padding:8px;border-radius:4px}
  .layer{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(0,255,0,0.04)}
  .status{font-weight:700;color:var(--muted)}
  .controls{margin-top:8px}
  button{background:var(--accent);border:none;padding:8px 10px;border-radius:6px;margin-right:6px;cursor:pointer}
  small{display:block;color:#8f8;margin-top:8px}
  canvas{width:100%;height:100%;display:block;background:transparent;border-radius:6px}
  .footer{font-size:12px;color:#8f8;margin-top:8px}
  .point{font-weight:700;color:#9f9}
  .note{color:#9f9}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card" aria-labelledby="title">
      <header>
        <h1 id="title">CONTINIUM — 6‑Ebene Monitor</h1>
        <div class="note">SYN • QUANT • CONST • TMP • QSXI • ORBIT</div>
      </header>

      <section aria-labelledby="layersTitle" style="margin-top:10px">
        <div id="layersList" role="list">
          <!-- Dynamically filled -->
        </div>
      </section>

      <section class="controls">
        <button id="btnStart">Start</button>
        <button id="btnStop">Stop</button>
        <button id="btnRecompute">Recompute fix‑point</button>
        <button id="btnExport">Export JSON</button>
        <small>Tip: Wenn ein Modul fehlt, werden sichere Defaults benutzt; die Seite bricht nicht.</small>
      </section>

      <section style="margin-top:10px">
        <div>Fix‑(Axiom)‑Punkt:</div>
        <pre id="fixPoint" class="point">—</pre>
        <div class="footer">© iki1uc wieimmer · CONTINIUM · Unified OS7</div>
      </
