<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>CONTINIUM · JS‑OS · iki1uc</title>

<style>
body {
    margin:0;
    background:#000;
    color:#0f0;
    font-family:Consolas, monospace;
}
#stageLink {
    position:absolute;
    top:20px;
    right:20px;
    color:#6cf;
    font-size:20px;
}
canvas { display:block; }
</style>

<script type="module">

import { QUANT } from "./JS/CONST_QUANT.js";
import { CONTINIUM_KEY } from "./JS/CONTINIUM_KEY.js";
import { SLIDE } from "./JS/slide.js";
import { RUN8 } from "./JS/real.reaspo.scan.js";
import { orbitTick } from "./JS/lauf.js";

RUN8();
QUANT.start();

const cv = document.createElement("canvas");
cv.width = window.innerWidth;
cv.height = window.innerHeight;
document.body.appendChild(cv);
const ctx = cv.getContext("2d");

function draw(scene){
    ctx.clearRect(0,0,cv.width,cv.height);

    const cx = cv.width/2;
    const cy = cv.height/2;

    // QS‑XI
    ctx.strokeStyle = "#6cf";
    ctx.beginPath();
    ctx.moveTo(cx + scene.qsxi.tokio.x/30, cy + scene.qsxi.tokio.y/30);
    ctx.lineTo(cx + scene.qsxi.corlu.x/30, cy + scene.qsxi.corlu.y/30);
    ctx.lineTo(cx + scene.qsxi.hh.x/30,    cy + scene.qsxi.hh.y/30);
    ctx.closePath();
    ctx.stroke();

    // Atom
    ctx.fillStyle = "#0f0";
    ctx.font = "32px Consolas";
    ctx.fillText(scene.atom, cx - 16, cy - 16);
}

function LOOP(){
    const t = performance.now() * 0.0004;

    const pos = CONTINIUM_KEY.pos(t);

    const scene = {
        atom: QUANT.atom.seq[Math.floor((t*10) % QUANT.atom.seq.length)],
        qsxi: QUANT.qsxi(),
        orbit: pos,
        slide: SLIDE(pos)
    };

    draw(scene);
    orbitTick(0.016);
    requestAnimationFrame(LOOP);
}

window.onload = LOOP;
</script>

</head>
<body>

<a id="stageLink" href="stage.html">Stage‑OS öffnen</a>

</body>
</html>
