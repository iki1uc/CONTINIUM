<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>CONTINIUM · Unified OS · iki1uc</title>

<style>
body {
    margin:0;
    background:#000;
    color:#0f0;
    font-family:Consolas, monospace;
}
#out {
    position:absolute;
    top:20px;
    left:20px;
    width:360px;
    height:420px;
    overflow:auto;
    background:#111;
    border-left:3px solid #6cf;
    padding:15px;
}
canvas {
    display:block;
}
</style>

<script type="module">
import { CONTINIUM_KEY } from "./CONTINIUM_KEY.js";
import { LAUF } from "./lauf.js";
import { orbitTick } from "./orbitTick.js";
import {
    WHIRL,
    PIPELINE_3_6,
    CONTINIUM_TRUTH
} from "./um.js";

/* ======================================================
   QS‑XI‑XTender SPRUNG-ORBIT (SYN + QUANDT)
   ====================================================== */

// Orbit A → 1/3 Sprung (120°)
let angleA = 0;

// Orbit B → 90° Sprung
let angleB = 0;

// Orbit C → optional (45°)
let angleC = 0;

// Sprung jede Sekunde
setInterval(()=>{
    angleA += Math.PI * (2/3);   // 120°
    angleB += Math.PI * (1/2);   // 90°
    angleC += Math.PI * (1/4);   // 45°
}, 1000);

// Orbit-Funktionen
function QSXI(){
    return {
        tokio: {
            x: Math.cos(angleA) * 2268,
            y: Math.sin(angleA) * 2268
        },
        corlu: {
            x: Math.cos(angleB) * 756,
            y: Math.sin(angleB) * 756
        },
        hh: {
            x: Math.cos(angleC) * 243,
            y: Math.sin(angleC) * 243
        }
    };
}

/* ======================================================
   CANVAS
   ====================================================== */
const cv = document.createElement("canvas");
cv.width = window.innerWidth;
cv.height = window.innerHeight;
document.body.appendChild(cv);
const ctx = cv.getContext("2d");

/* ======================================================
   TEXT‑OUTPUT
   ====================================================== */
const out = document.createElement("pre");
out.id = "out";
out.textContent = "Starte CONTINIUM OS…";
document.body.appendChild(out);

/* ======================================================
   ATOM‑Beweis Animation
   ====================================================== */
function ATOM_ANIM(t){
    const seq = CONTINIUM_KEY.sequence();
    return seq[Math.floor((t*10) % seq.length)];
}

/* ======================================================
   Singularität
   ====================================================== */
function SINGULAR_VIEW(t){
    const p = CONTINIUM_KEY.pos(t);
    const s = CONTINIUM_KEY.singularity(p);
    return { p, s };
}

/* ======================================================
   VISUAL DRAW
   ====================================================== */
function draw(scene){
    ctx.clearRect(0,0,cv.width,cv.height);

    const cx = cv.width/2;
    const cy = cv.height/2;

    // QS‑XI‑XTender Dreieck (SYN + QUANDT)
    ctx.strokeStyle = "#6cf";
    ctx.beginPath();
    ctx.moveTo(cx + scene.qsxi.tokio.x/30, cy + scene.qsxi.tokio.y/30);
    ctx.lineTo(cx + scene.qsxi.corlu.x/30, cy + scene.qsxi.corlu.y/30);
    ctx.lineTo(cx + scene.qsxi.hh.x/30,    cy + scene.qsxi.hh.y/30);
    ctx.closePath();
    ctx.stroke();

    // ATOM‑Beweis
    ctx.fillStyle = "#0f0";
    ctx.font = "32px Consolas";
    ctx.fillText(scene.atom, cx - 16, cy - 16);

    // Singularität (Schwarzes Loch)
    ctx.strokeStyle = "#f00";
    ctx.beginPath();
    ctx.arc(cx, cy, scene.singular.s.radius/300, 0, Math.PI*2);
    ctx.stroke();
}

/* ======================================================
   LOOP
   ====================================================== */
let pipe = null;

function CONTINIUM_LOOP(){

    const t = performance.now() * 0.0004;

    const pos = CONTINIUM_KEY.pos(t);
    const slide = CONTINIUM_KEY.slideFrame(pos);
    const score = CONTINIUM_KEY.stability(pos);

    const atom = ATOM_ANIM(t);
    const qsxi = QSXI();
    const singular = SINGULAR_VIEW(t);

    const truth = CONTINIUM_TRUTH();
    const whirl = WHIRL({ x: 9, y: 6, z: 3 });
    const lauf = LAUF.komplett();

    const scene = {
        orbit: pos,
        slide,
        score,
        atom,
        qsxi,
        singular,
        lauf,
        truth,
        whirl,
        skills: CONTINIUM_KEY.skills
    };

    draw(scene);

    out.textContent = JSON.stringify(scene, null, 2);

    orbitTick(0.016);

    requestAnimationFrame(CONTINIUM_LOOP);
}

/* ======================================================
   START
   ====================================================== */
window.onload = () => {
    pipe = PIPELINE_3_6();
    CONTINIUM_LOOP();
};
</script>

</head>
<body></body>
</html>
