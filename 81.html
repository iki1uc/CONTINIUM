<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>CONTINIUM‑81 · SYN‑Raum · Einstiegs‑Ebene</title>

<style>
body { margin:0; background:#000; color:#0f0; font-family:Consolas; text-align:center; padding-top:120px; }
h1 { font-size:48px; color:#6cf; }
p { font-size:22px; color:#0f0; }
pre {
    background:#111; border-left:3px solid #6cf;
    padding:20px; width:420px; margin:40px auto; text-align:left;
}
a { color:#6cf; font-size:20px; }
</style>

<script type="module">
import { QUANT } from "./JS/CONST_QUANT.js";
import { CONTINIUM_KEY } from "./JS/CONTINIUM_KEY.js";
import { TMP_MATRIX } from "./tmp/360.js";

QUANT.start();

function SYN_STATE(){
    const t = performance.now() * 0.0004;
    const pos = CONTINIUM_KEY.pos(t);
    const singular = QUANT.singular(pos);

    let tmp = 0;
    for(const k in TMP_MATRIX) tmp += TMP_MATRIX[k].calc(t);

    return {
        room:"SYN‑81",
        state:"ACTIVE",
        pos,
        atom: QUANT.atom.seq[Math.floor((t*10) % QUANT.atom.seq.length)],
        qsxi: QUANT.qsxi(),
        singular,
        tmpEnergy: tmp / 1000
    };
}

function LOOP(){
    const syn = SYN_STATE();
    document.getElementById("synOut").textContent =
        JSON.stringify(syn, null, 2);
    requestAnimationFrame(LOOP);
}

window.onload = LOOP;
</script>

</head>

<body>

<h1>CONTINIUM‑81 · SYN‑Raum</h1>
